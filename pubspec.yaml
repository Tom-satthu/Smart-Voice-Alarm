name: smart_voice_alarm
description: Smart Voice Alarm — wake up with your own voice sequences.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  record: ^6.0.0
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  flutter_tts: ^4.2.2
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  permission_handler: ^12.0.0+1
  collection: ^1.19.1
  url_launcher: ^6.3.1
  in_app_purchase: ^3.2.3
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ringtones/
